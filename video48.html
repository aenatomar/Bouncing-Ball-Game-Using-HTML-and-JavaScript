<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 8 Solution</title>
   <style>
    .container{
        width:65vw;
        height:80vh;
        background-color:blue;
        position:relative;
    }
    .box{
        width:68px;
        height:70px;
        background-color:red;
        border-radius:70px;
        position:absolute;
        bottom:0;
        left:0;
        animation:animinatex 3s linear infinite ,animinatey 2s ease-out infinite alternate;
        
    }
    @keyframes animinatex{
        from{
            left:0;
        }
        to{
            left:100%;

        }
    }
    @keyframes animinatey{
        from{
            bottom:0;
        }
        to{
            bottom:100%;
        }

    }
   </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
    
</body>
</html>
